[project]
name = "antifake-backend"
version = "0.1.0"
description = "AntiFake MVP: bounded adversarial image protection for one named AI pipeline"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The default run is fully offline. `network` needs to download target-model
# weights; `slow` costs more than a couple of seconds. Run them with:
#   pytest -m network
#   pytest -m "not network"
addopts = "-q --strict-markers -m 'not network'"
markers = [
    "network: requires downloading pretrained target-model weights",
    "slow: takes more than a couple of seconds",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 90
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # comprehensions
    "SIM",  # simplify
    "PTH",  # use pathlib
    "RUF",  # ruff-specific
    "ANN",  # annotations
    "S",    # bandit
    "D",    # pydocstyle
    "T20",  # no print()
]
ignore = [
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "ANN401", # Any is acceptable in the model-building shim
    "N812",   # `import torch.nn.functional as F` is the conventional name
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D100", "D101", "D102", "D103", "D104", "ANN001", "ANN201", "ANN202", "PTH123", "S311", "ARG002", "N806"]
"scripts/*" = ["T20", "S310", "D103", "E501"]
# A CLI entry point is supposed to print to stdout; the shared T20 rule exists
# for library code, not for the one module whose job is terminal output.
"app/evaluation/run.py" = ["T20"]
"app/evaluation/run_phases.py" = ["T20"]
# FastAPI's dependency-injection idiom is `Depends(...)` / `File(...)` in a
# default argument. B008 does not apply to it.
"app/api/*" = ["B008", "S608"]
"app/protection/image_io.py" = ["S608"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = []
exclude = ["^tests/"]

[[tool.mypy.overrides]]
module = ["cv2.*", "torchvision.*"]
ignore_missing_imports = true
